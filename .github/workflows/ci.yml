name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore API
        run: dotnet restore src/ExchangeTest.Api/ExchangeTest.Api.csproj

      - name: Restore tests
        run: dotnet restore tests/ExchangeTest.Api.Tests/ExchangeTest.Api.Tests.csproj

      - name: Build API
        run: dotnet build src/ExchangeTest.Api/ExchangeTest.Api.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/ExchangeTest.Api.Tests/ExchangeTest.Api.Tests.csproj --configuration Release --no-restore
